[package]
name = "multimodel-wiki-workbench"
version = "0.1.0"
description = "Local multi-model discussion and wiki workbench"
authors = ["canyue-1"]
edition = "2024"

[lib]
name = "multimodel_wiki_workbench_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
imagesize = "0.15"
keyring = "3"
pdf-extract = "0.12"
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "6", default-features = false, features = ["deflate"] }

[dev-dependencies]
lopdf = { version = "0.42", default-features = false }
tempfile = "3"
