[package]
name = "multimodel-wiki-workbench"
version = "0.1.0"
description = "Local multi-model discussion and wiki workbench"
authors = ["canyue-1"]
edition = "2024"

[lib]
name = "multimodel_wiki_workbench_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
